<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidrolife - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>


    <!-- Títulos -->
    <div class="container text-center mt-5">
        <h1 class="mb-2 hydro-title">Creación de usuario</h1>

        <h2 class="fw-normal">Diligencie el siguiente formulario</h2>
    </div>

    <div class="container d-flex justify-content-center mt-5">
        <div class="form-box w-100">
            <form class="row g-3" th:action="@{/usuarios/crear}" th:object="${usuario}" method="post">
                <div class="col-md-12">
                    <label for="inputNombre"  class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="inputContrasenia"  class="form-label">Constraseña</label>
                    <input type="password" th:field="*{password}" class="form-control">
                </div>
                
                <div class="col-12">
                    <label for="inputEmail"  class="form-label">Correo electronico</label>
                    <input type="email" class="form-control" th:field="*{email}">
                </div>
                
                <div class="col-md-12">
                    <label for="inputTelefono"  class="form-label">Numero de celular</label>
                    <input type="tel" class="form-control" th:field="*{telefono}">
                </div>

                <div class="d-flex justify-content-center gap-5 mt-4">
                    <button type="submit" class="btn btn-hydro-outline px-4 py-2">Registrar</button>

                    <a th:href="@{/login}" class="btn btn-hydro px-4 py-2">
                        Cancelar
                    </a>
                </div>
            
            </form>
        </div>
    </div>


</body>

</html>
