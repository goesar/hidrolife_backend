<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor de pH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>

<!-- BOTÓN VOLVER -->
<div class="d-flex p-4">
    <a th:href="@{/sensores}" class="btn btn-hydro py-2">
        <span class="icono">
            <i data-lucide="circle-arrow-left"></i>

        </span>
        <span class="texto">Volver al menú</span>

    </a>
</div>


<!-- TÍTULO -->
<div class="container text-center mt-3">
    <h1 class="hydro-title sensor-title">Sensor de Temperatura</h1>

</div>


<!-- CONTENEDOR PRINCIPAL: DOS COLUMNAS -->
<div class="container d-flex justify-content-center align-items-start mt-3 gap-5">


    <!-- COLUMNA IZQUIERDA: TARJETA DEL SENSOR -->
    <div class="big-icon-card  text-center" style="width: 450px;">
        <i class="bi bi-thermometer-sun big-icon"></i>


        <!-- VALOR REAL DEL SENSOR -->
        <div class="d-flex align-items-baseline justify-content-center mt-4">
            <h1 id="valorTemperatura" th:text="${lectura.temperatura}"
                style="color:#3BDE26; font-size: 4rem; margin-right: 10px;">

            </h1>
            <span style="color:white; font-size: 3.5rem;">C°</span>
        </div>

    </div>

    <!-- COLUMNA DERECHA: AJUSTE DE TOLERANCIAS -->
    <form th:action="@{/guardarConfig}" method="post">
        <div class="ms-5 contenedorTolerancias" style="width: 380px;">


            <!-- Tolerancia superior -->
            <!-- Tolerancia superior -->
            <h2 class="mb-3 text-center">
                <span sec:authorize="hasRole('ADMIN')">
                    Ajustar tolerancia superior
                </span>
                <span sec:authorize="hasRole('USER')">
                    Tolerancia superior
                </span>
            </h2>

            <div class="d-flex justify-content-center align-items-center gap-3">
                <input type="hidden"
                       name="idConfigSensor"
                       th:value="${config.idConfigSensor}"/>
                <button type="button" sec:authorize="hasRole('ADMIN')" class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('sup', -0.1)">-
                </button>
                <input id="tolSup" type="number" name="valorMaximo" th:value="${config.valorMaximo}" step="0.01"
                       class="form-control text-center fw-bold fs-4"
                       style="width: 220px;">
                <button type="button" sec:authorize="hasRole('ADMIN')" class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('sup', 0.1)">+
                </button>
            </div>

            <!-- Tolerancia inferior -->
            <h2 class="mt-5 mb-3 text-center ">Ajustar tolerancia inferior</h2>

            <div class="d-flex justify-content-center align-items-center gap-3 mb-4">
                <button type="button" sec:authorize="hasRole('ADMIN')" class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('inf', -0.1)">-
                </button>
                <input id="tolInf" type="number" name="valorMinimo" th:value="${config.valorMinimo}" step="0.01"
                       class="form-control text-center fw-bold fs-4"
                       style="width: 220px;">
                <button type="button" sec:authorize="hasRole('ADMIN')" class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('inf', 0.1)">+
                </button>
            </div>

            <div class="d-flex justify-content-center align-items-center">
                <button sec:authorize="hasRole('ADMIN')"
                        type="button"
                        class="btn btn-hydro px-4 fw-bold fs-5"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmModal">
                    Guardar
                </button>

            </div>
        </div>
        <input type="hidden" name="redirectUrl" value="/sensorTemperatura">
    </form>

</div>
<div class="d-flex justify-content-center">
    <div class="w-40">
        <div th:if="${msg}"
             class="alert alert-success alert-dismissible fade show text-center mt-3"
             role="alert">
            <span th:text="${msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}"
             class="alert alert-danger alert-dismissible fade show text-center mt-3"
             role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
    <!-- Modal Confirmación -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Confirmar cambios</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    ¿Está seguro de que desea cambiar los límites del sensor?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button"
                            class="btn btn-hydro"
                            onclick="enviarFormulario()">
                        Sí, guardar cambios
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function cambiarValor(tipo, cambio) {
        let input = document.getElementById(tipo === 'inf' ? "tolInf" : "tolSup");
        let valor = parseFloat(input.value) + cambio;

        if (valor < 0) valor = 0;  // NO permitir valores negativos

        input.value = valor.toFixed(2);
    }

    setInterval(function () {
        fetch('/api/lecturas/ultima')
            .then(response => response.json())
            .then(data => {
                if (data && data.temperatura !== null) {
                    document.getElementById("valorTemperatura").innerText = data.temperatura;
                }
            })
            .catch(error => console.error("Error obteniendo lectura:", error));
    }, 5000);


    function enviarFormulario() {
        document.querySelector("form").submit();
    }
</script>
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
</body>

</html>
