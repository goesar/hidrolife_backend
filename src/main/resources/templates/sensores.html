<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidrolife - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=water_ph"/>


    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>
<div class="d-flex p-4">
    <a th:href="@{/menuPrincipal}" class="btn btn-hydro py-2">
        <span class="icono">
            <i data-lucide="circle-arrow-left"></i>

        </span>
        <span class="texto">Volver al menú</span>

    </a>
</div>

<!-- Títulos -->
<div class="container text-center mt-2">
    <h1 class="mb-2 hydro-title">Panel de sensores</h1>

    <h2 class="fw-normal">Seleccione el sensor que desea observar</h2>
</div>

<div class="container mt-2">
    <div class="row justify-content-center g-5 mt-1">

        <!-- BOTÓN 1 -->
        <div class="col-12 col-md-3 col-lg-3">
            <a th:href="@{/sensorPH}" class="big-icon-btn">
                <i class="bi bi-droplet-half"></i>
                <span>pH</span>
                <!-- VALOR REAL DEL SENSOR -->
                <h1 id="valorPH" th:text="${lectura.ph}" class="mt-4" style="color:#3BDE26; font-size: 3.5rem;">

                </h1>
            </a>
        </div>

        <!-- BOTÓN 2 -->
        <div class="col-12 col-md-3 col-lg-3">
            <a th:href="@{/sensorTDS}" class="big-icon-btn">
                <i class="bi bi-yin-yang"></i>
                <span>TDS</span>
                <div class="d-flex align-items-end justify-content-center mt-3">

                    <h1 id="valorTDS" style="color:#3BDE26; font-size: 3.5rem; margin-right: 10px;">

                    </h1>
                    <span style="color:white; font-size: 3rem;">ppm</span>

                </div>

            </a>
        </div>

        <!-- BOTÓN 3 -->
        <div class="col-12 col-md-3 col-lg-3">
            <a th:href="@{/sensorTemperatura}" class="big-icon-btn">
                <i class="bi bi-thermometer-sun"></i>
                <span>Temperatura</span>
                <div class="d-flex align-items-end justify-content-center mt-3">

                    <h1 id="valorTemperatura" th:text="${lectura.temperatura}"
                        style="color:#3BDE26; font-size: 3.5rem; margin-right: 10px;">

                    </h1>
                    <span style="color:white; font-size:3rem; margin-left:8px; margin-bottom:6px;">
        C°
    </span>

                </div>

            </a>
        </div>
        <div class="col-12 col-md-3 col-lg-3">
            <a th:href="@{/sensorHumedad}" class="big-icon-btn">

                <i class="bi bi-moisture"></i>

                <span>Humedad</span>

                <div class="d-flex align-items-end justify-content-center mt-3">



                    <h1 id="valorHumedad" th:text="${lectura.humedad}"
                        style="color:#3BDE26; font-size: 3.5rem; margin-right: 10px;">

                    </h1>
                    <span style="color:white; font-size:3rem; margin-left:8px; margin-bottom:6px;">
        %HR
    </span>
                </div>

            </a>
        </div>

    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
</body>

</html>
