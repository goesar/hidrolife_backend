<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidrolife - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=water_ph" />


    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>
    <div class="container mt-4">
        <a th:href="@{/menuPrincipal}" class="btn btn-hydro px-3 py-1">
            <i class="bi bi-arrow-left-circle me-2"></i>
            <span>Volver al menú</span>

        </a>
    </div>

    <!-- Títulos -->
    <div class="container text-center mt-5">
        <h1 class="mb-2 hydro-title">Panel de sensores</h1>

        <h2 class="fw-normal">Seleccione la el sensor que desea observar</h2>
    </div>

    <div class="container mt-2">
        <div class="row justify-content-center g-5 mt-1">

            <!-- BOTÓN 1 -->
            <div class="col-12 col-md-3 col-lg-3">
                <a th:href="@{/sensorPH}" class="big-icon-btn">
                    <i class="bi bi-droplet-half"></i>
                    <span>Sensor de pH</span>
                </a>
            </div>

            <!-- BOTÓN 2 -->
            <div class="col-12 col-md-3 col-lg-3">
                <a th:href="@{/sensorTDS}" class="big-icon-btn">
                    <i class="bi bi-yin-yang"></i>
                    <span>Sensor de TDS</span>
                </a>
            </div>

            <!-- BOTÓN 3 -->
            <div class="col-12 col-md-3 col-lg-3">
                <a th:href="@{/sensorTemperatura}" class="big-icon-btn">
                    <i class="bi bi-thermometer-sun"></i>
                    <span>Sensor de Temperatura</span>
                </a>
            </div>
            
            <!-- BOTÓN 4 -->
            <div class="col-12 col-md-3 col-lg-3">
                <a th:href="@{/sensorHumedad}" class="big-icon-btn">
                    <i class="bi bi-moisture"></i>
                    <span>Sensor de Humedad</span>
                </a>
            </div>

        </div>
    </div>


</body>

</html>
