<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor de pH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>

<!-- BOTÓN VOLVER -->
<div class="container mt-4">
        <a th:href="@{/sensores}" class="btn btn-hydro px-3 py-1">
            <i class="bi bi-arrow-left-circle me-2"></i>
            <span>Volver al menú</span>

        </a>
    </div>


<!-- TÍTULO -->
<div class="container text-center mt-3">
    <h1 class="hydro-title sensor-title">Sensor de pH</h1>

</div>


<!-- CONTENEDOR PRINCIPAL: DOS COLUMNAS -->
<div class="container d-flex justify-content-center align-items-start mt-3 gap-5">


    <!-- COLUMNA IZQUIERDA: TARJETA DEL SENSOR -->
    <div class="big-icon-card  text-center" style="width: 450px;">
        <i class="bi bi-droplet-half big-icon"></i>


        <h1 class="mt-3">pH</h1>

        <!-- VALOR REAL DEL SENSOR -->
        <h1 id="valorPH" class="mt-4" style="color:#3BDE26; font-size: 3rem;">
            6.45
        </h1>
    </div>

    <!-- COLUMNA DERECHA: AJUSTE DE TOLERANCIAS -->
    <div class="ms-5 contenedorTolerancias" style="width: 380px;">

        

        <!-- Tolerancia superior -->
        <h2 class="mb-3 text-center">Ajustar tolerancia superior</h2>

        <div class="d-flex justify-content-center align-items-center gap-3">
            <button class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('sup', -0.1)">-</button>
            <input id="tolSup" type="number" value="7.50" step="0.01"
                   class="form-control text-center fw-bold fs-4"
                   style="width: 220px;">
            <button class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('sup', 0.1)">+</button>
        </div>

        <!-- Tolerancia inferior -->
        <h2 class="mt-5 text-center ">Ajustar tolerancia inferior</h2>

        <div class="d-flex justify-content-center align-items-center gap-3 mb-5">
            <button class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('inf', -0.1)">-</button>
            <input id="tolInf" type="number" value="5.80" step="0.01"
                   class="form-control text-center fw-bold fs-4"
                   style="width: 220px;">
            <button class="btn btn-hydro px-4 fw-bold fs-5" onclick="cambiarValor('inf', 0.1)">+</button>
        </div>
    </div>

</div>


<!-- SCRIPT -->
<script>
function cambiarValor(tipo, cambio) {
    let input = document.getElementById(tipo === 'inf' ? "tolInf" : "tolSup");
    let valor = parseFloat(input.value) + cambio;

    if (valor < 0) valor = 0;  // NO permitir valores negativos

    input.value = valor.toFixed(2);
}
</script>

</body>
</html>
