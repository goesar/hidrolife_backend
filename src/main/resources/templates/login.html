<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>HidroLife - Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/styles.css}">
    </head>

    <body>


        <!-- Títulos -->
        <div class="container text-center mt-5">
            <h1 class="mb-2 hydro-title sensor-title">Bienvenido a HidroLife</h1>

            <h2 class="fw-normal mt-5">Iniciar sesión</h2>
        </div>
        <form th:action="@{/login}" method="post">
            <div class="container d-flex justify-content-center mt-2 p-3">
                <div class="card p-4 mt-2 border border-2 card-login" style="max-width: 480px; width: 100%;">

                    <div class="form-floating mb-4 form-input">
                        <input type="text" name="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                        <label for="floatingInput" class="form-input">Email</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password">
                        <label for="floatingPassword">Contraseña</label>
                    </div>


                    <div class="d-flex justify-content-center gap-4 mt-2">
                        <button type="submit" class="btn btn-hydro px-4 py-2">
                            Iniciar sesión
                        </button>
                        <a th:href="@{/nuevoUsuario}" class="btn btn-hydro px-4 py-2">
                            Crear usuario
                        </a>
                    </div>



                </div>
            </div>
        </form>
            <!-- MENSAJES FLASH -->
            <div class="d-flex justify-content-center">
                <div class="w-40">
                    <div th:if="${msg}" 
                         class="alert alert-success alert-dismissible fade show text-center mt-3" 
                         role="alert">
                        <span th:text="${msg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${error}" 
                         class="alert alert-danger alert-dismissible fade show text-center mt-3" 
                         role="alert">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
                </div>
            </div>
    </body>

</html>
